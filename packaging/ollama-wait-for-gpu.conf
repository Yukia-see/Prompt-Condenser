# Installed by prompt-condenser.
# At boot the GPU driver can still be initializing when Ollama starts; Ollama then
# picks the CPU and never re-checks. Wait (up to 30 s) until Vulkan lists a GPU.
# A file with the same name in /etc/systemd/system/ollama.service.d/ overrides this one.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do vulkaninfo --summary 2>/dev/null | grep -qE "PHYSICAL_DEVICE_TYPE_(INTEGRATED|DISCRETE)_GPU" && exit 0; sleep 1; done; echo "No Vulkan GPU after 30s, starting Ollama anyway"; exit 0'
TimeoutStartSec=90
